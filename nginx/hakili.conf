# ---------------------------------------------------------------------------
# Reverse proxy TLS devant l'app Shiny - a adapter (nom de domaine, chemins
# de certificat) avant le premier deploiement reel. Sans ce proxy (ou un
# equivalent), les codes d'acces et toutes les donnees comptables circulent
# en clair sur le reseau : ne jamais exposer le port 8000 de l'app
# directement en dehors d'un reseau local de confiance.
#
# Certificat : un certificat Let's Encrypt (gratuit, via certbot) convient
# parfaitement ici. Le placer dans ./nginx/certs/ (fullchain.pem, privkey.pem)
# ou adapter les chemins ci-dessous vers l'emplacement choisi.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # En-tetes de securite : HSTS force le navigateur a ne plus jamais
    # retenter le http:// pour ce domaine (utile des la premiere visite en
    # https, la redirection 80->443 ci-dessus ne protege pas un tout premier
    # appel fait directement en clair par un client malveillant). X-Frame-
    # Options et X-Content-Type-Options sont deux durcissements standards
    # sans effet de bord connu sur une app Shiny.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        # 127.0.0.1:8022, et non app:8000 (corrige le 22/09/2026), pour DEUX
        # raisons cumulees :
        #   - le port : le service Shiny publie 8022 depuis le 15/09/2026
        #     (voir docker-compose.yml et Dockerfile - 8000 deja pris par
        #     "guichet-entrepreneur" sur ce serveur) ;
        #   - le nom d'hote : ce nginx tourne sur la machine HOTE, pas dans
        #     un conteneur du meme reseau Docker (voir le commentaire en tete
        #     de docker-compose.yml - la version anterieure du depot avait un
        #     service nginx dans le compose, ce n'est plus le cas depuis le
        #     15/09/2026). "app" n'est un nom resoluble que DANS le reseau
        #     Docker interne ; depuis l'hote, seul 127.0.0.1:8022 (le port
        #     publie par le service app) est joignable.
        # A elles deux, ces deux erreurs auraient rendu l'application
        # inaccessible via nginx dans a peu pres tous les cas de figure.
        proxy_pass http://127.0.0.1:8022;
        proxy_http_version 1.1;

        # Shiny a besoin des websockets pour le rafraichissement reactif
        # (poll de revision_bd, chat de l'assistant IA en streaming) : sans
        # ces deux en-tetes, l'app se charge mais reste figee cote client.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
