# ---------------------------------------------------------------------------
# Reverse proxy TLS devant l'app Shiny - a adapter (nom de domaine, chemins
# de certificat) avant le premier deploiement reel. Sans ce proxy (ou un
# equivalent), les codes d'acces et toutes les donnees comptables circulent
# en clair sur le reseau : ne jamais exposer le port 8000 de l'app
# directement en dehors d'un reseau local de confiance.
#
# Certificat : un certificat Let's Encrypt (gratuit, via certbot) convient
# parfaitement ici. Le placer dans ./nginx/certs/ (fullchain.pem, privkey.pem)
# ou adapter les chemins ci-dessous vers l'emplacement choisi.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;

        # Shiny a besoin des websockets pour son rafraichissement reactif :
        # sans ces deux en-tetes, l'app peut se charger mais rester figee cote client.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
